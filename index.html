<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Plataforma Ana Brez — Área do Aluno</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D1B2A'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='800' fill='%23C9A84C' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400" rel="stylesheet">
<style>
  :root{
    --gold:#C9A84C; --gold-dark:#A07E2E; --gold-light:#E8D48A; --gold-bg:#FBF5E6;
    --navy:#0D1B2A; --navy-2:#1B3A5C; --navy-3:#24486E;
    --green:#5B9A3C; --red:#C0392B;
    --bg:#F7F6F2; --surface:#FFFFFF; --gray-light:#F0EFE9; --gray:#D8D7D1;
    --text:#1A1A2E; --text-muted:#6B7280;
    --radius:14px; --radius-sm:9px;
    --shadow:0 4px 18px rgba(0,0,0,0.10);
    --shadow-lg:0 16px 44px rgba(0,0,0,0.28);
    --bar-h:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 540px at 50% -8%, rgba(201,168,76,0.20), transparent 58%),
      radial-gradient(760px 560px at 112% 116%, rgba(36,72,110,0.55), transparent 55%),
      linear-gradient(165deg, #0B1622 0%, #0F2137 55%, #16314E 100%);
    background-attachment:fixed;
  }
  body.in-tool{overflow:hidden}

  /* ============ HUB ============ */
  .wrap{max-width:940px; margin:0 auto; padding:46px 20px 56px}
  .hero{text-align:center; color:#fff; margin-bottom:40px}
  .emblem{
    width:62px; height:62px; margin:0 auto 16px; border-radius:50%;
    background:var(--navy); display:flex; align-items:center; justify-content:center;
    border:2px solid var(--gold); box-shadow:0 0 0 6px rgba(201,168,76,0.14);
  }
  .emblem span{font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:31px; color:var(--gold)}
  .hero h1{font-family:'Playfair Display',Georgia,serif; font-weight:800; font-size:34px; letter-spacing:.01em}
  .hero h1 span{color:var(--gold); margin:0 5px}
  .kicker{font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-light); margin-top:8px}
  .lead{max-width:560px; margin:16px auto 0; font-size:15px; line-height:1.65; color:rgba(255,255,255,.82)}
  .progress{
    display:inline-flex; align-items:center; gap:9px; margin-top:20px; padding:7px 16px;
    background:rgba(255,255,255,.07); border:1px solid rgba(201,168,76,.32); border-radius:30px;
    font-size:12.5px; font-weight:600; color:var(--gold-light);
  }
  .progress .dots{display:flex; gap:5px}
  .progress .dot{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.2)}
  .progress .dot.on{background:var(--gold)}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:20px}
  .card{
    background:var(--surface); border-radius:var(--radius); padding:24px 22px 22px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; position:relative;
    border-top:3px solid var(--gold); transition:transform .18s, box-shadow .18s;
  }
  .card.on:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg)}
  .card.off{border-top-color:var(--gray); opacity:.96}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
  .aula{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-dark)}
  .badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; display:inline-flex; align-items:center; gap:5px}
  .b-on{background:#E8F5DC; color:var(--green)}
  .b-off{background:var(--gray-light); color:var(--text-muted)}
  .card-icon{
    width:54px; height:54px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    background:var(--gold-bg); color:var(--gold-dark); margin-bottom:14px;
  }
  .card.off .card-icon{background:var(--gray-light); color:var(--gray)}
  .card-icon svg{width:28px; height:28px}
  .card h3{font-family:'Playfair Display',Georgia,serif; font-weight:800; font-size:21px; color:var(--navy); margin-bottom:7px}
  .card-sub{font-size:13.5px; line-height:1.55; color:var(--text-muted); flex:1; margin-bottom:18px}

  .btn-open{
    width:100%; padding:13px; border:none; border-radius:var(--radius-sm); cursor:pointer;
    background:var(--navy); color:var(--gold); font-family:inherit; font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s;
  }
  .btn-open:hover{background:var(--navy-2)}
  .btn-open svg{width:16px; height:16px}

  .unlock .unlock-row{display:flex; gap:8px}
  .unlock input{
    flex:1; min-width:0; padding:12px 13px; font-size:14px; font-family:inherit;
    border:1.5px solid var(--gray); border-radius:var(--radius-sm); background:var(--bg); color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  .unlock input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-bg); background:#fff}
  .unlock button{
    flex:0 0 auto; padding:0 16px; border:none; border-radius:var(--radius-sm); cursor:pointer;
    background:var(--gold); color:var(--navy); font-family:inherit; font-weight:700; font-size:13px; transition:background .15s;
  }
  .unlock button:hover{background:var(--gold-light)}
  .unlock.bad input{border-color:var(--red); animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .err{font-size:12px; font-weight:600; color:var(--red); margin-top:8px; height:15px; opacity:0; transition:opacity .15s}
  .unlock.bad .err{opacity:1}
  .lock-hint{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); margin-top:10px}
  .lock-hint svg{width:13px; height:13px}

  .hub-foot{text-align:center; margin-top:42px; font-size:12px; color:rgba(255,255,255,.55); line-height:1.7}
  .hub-foot b{color:var(--gold-light); font-weight:700}

  /* ============ TOOL VIEW ============ */
  #toolView{display:none}
  body.in-tool #toolView{display:flex; flex-direction:column; position:fixed; inset:0; z-index:1000; background:var(--bg)}
  .toolbar{
    height:var(--bar-h); flex:0 0 var(--bar-h); display:flex; align-items:center; gap:14px; padding:0 14px;
    background:var(--navy); border-bottom:2px solid var(--gold); box-shadow:var(--shadow);
  }
  .btn-back{
    flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm);
    background:transparent; border:1px solid rgba(255,255,255,.26); color:#fff; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; transition:.15s;
  }
  .btn-back:hover{border-color:var(--gold); color:var(--gold)}
  .btn-back svg{width:15px; height:15px}
  .tool-name{font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:18px; color:#fff; white-space:nowrap}
  .tool-name b{color:var(--gold)}
  .quick{display:flex; gap:6px; margin-left:auto; overflow-x:auto; scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .q{
    flex:0 0 auto; padding:7px 13px; border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap;
    background:transparent; border:1px solid transparent; color:rgba(255,255,255,.6);
    font-family:inherit; font-size:12.5px; font-weight:600; transition:.15s;
  }
  .q:hover{color:#fff; background:rgba(255,255,255,.07)}
  .q.q-on{background:var(--gold); color:var(--navy)}
  .frame-wrap{flex:1; position:relative; min-height:0; background:var(--bg)}
  iframe{width:100%; height:100%; border:0; display:block; background:var(--bg)}
  .loader{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); transition:opacity .3s; pointer-events:none}
  .loader.gone{opacity:0}
  .spin{width:38px; height:38px; border:3px solid var(--gold-bg); border-top-color:var(--gold); border-radius:50%; animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  @media (max-width:640px){
    .wrap{padding:34px 16px 44px}
    .hero h1{font-size:28px}
    .tool-name{font-size:15px; overflow:hidden; text-overflow:ellipsis; max-width:40vw}
    .quick .q small{display:none}
  }
</style>
</head>
<body>

<!-- ============ HUB ============ -->
<div class="wrap">
  <header class="hero">
    <div class="emblem"><span>B</span></div>
    <h1>Brez<span>·</span>Consultoria</h1>
    <div class="kicker">Área do Aluno · Gestão de Patrimônio</div>
    <p class="lead">Suas ferramentas são liberadas a cada aula. Use a senha que a Ana passa na aula para desbloquear cada uma.</p>
    <div class="progress"><span id="progTxt">0 de 3 liberadas</span><span class="dots" id="progDots"></span></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="hub-foot">
    Acesso exclusivo para alunos<br><b>Ana Brez</b> · Gestão de Patrimônio
  </footer>
</div>

<!-- ============ TOOL VIEW ============ -->
<div id="toolView">
  <header class="toolbar">
    <button class="btn-back" onclick="backToHub()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      Plataforma
    </button>
    <div class="tool-name" id="toolName"></div>
    <nav class="quick" id="quick"></nav>
  </header>
  <div class="frame-wrap">
    <iframe id="frame" title="Ferramenta" referrerpolicy="no-referrer"></iframe>
    <div class="loader" id="loader"><div class="spin"></div></div>
  </div>
</div>

<script>
/* ===========================================================================
   SENHAS DE CADA FERRAMENTA — uma por aula.
   Troque os valores abaixo pelas senhas que VOCÊ vai divulgar em cada aula.
   (Proteção simples no navegador, não é criptografia forte.)
   ===========================================================================
   Aula 1 -> Planilha de Gastos  -> senha: "gastos1"
   Aula 2 -> Mapa Financeiro     -> senha: "mapa2"
   Aula 3 -> Gestão de Carteira  -> senha: "carteira3"
   =========================================================================== */
const MODULOS = [
  { id:"planilha", aula:1, nome:"Planilha de Gastos", senha:"gastos1", src:"planilha-gastos.html",
    desc:"Organize seus gastos e veja para onde vai o seu dinheiro todo mês.",
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 5v14"/></svg>` },
  { id:"mapa", aula:2, nome:"Mapa Financeiro", senha:"mapa2", src:"mapa-financeiro.html",
    desc:"Descubra seu perfil de investidor e o diagnóstico do seu momento financeiro.",
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>` },
  { id:"carteira", aula:3, nome:"Gestão de Carteira", senha:"carteira3", src:"gestao-carteira.html",
    desc:"Acompanhe seus ativos e visualize a sua carteira por completo.",
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M21 8a9 9 0 0 0-9-5" opacity=".5"/></svg>` },
];

const UNLOCK_KEY = "brez_unlocked";
function getUnlocked(){ try{ var u=JSON.parse(localStorage.getItem(UNLOCK_KEY)||"[]"); return Array.isArray(u)?u:[]; }catch(e){ return []; } }
function isUnlocked(id){ return getUnlocked().indexOf(id) >= 0; }
function unlock(id){ var u=getUnlocked(); if(u.indexOf(id)<0){ u.push(id); localStorage.setItem(UNLOCK_KEY, JSON.stringify(u)); } }

const grid = document.getElementById("grid");
const lockSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="13" height="13"><path d="M5 12l5 5 9-11"/></svg>`;
const openSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

function renderHub(){
  const unl = getUnlocked();
  grid.innerHTML = MODULOS.map(m=>{
    const on = unl.indexOf(m.id) >= 0;
    return `<article class="card ${on?'on':'off'}">
      <div class="card-head">
        <span class="aula">Aula ${m.aula}</span>
        <span class="badge ${on?'b-on':'b-off'}">${on?checkSvg+' Liberada':lockSvg.replace('width="14" height="10"','')+' Bloqueada'}</span>
      </div>
      <div class="card-icon">${m.icon}</div>
      <h3>${m.nome}</h3>
      <p class="card-sub">${m.desc}</p>
      ${ on
        ? `<button class="btn-open" onclick="openTool('${m.id}')">Abrir ferramenta ${openSvg}</button>`
        : `<form class="unlock" onsubmit="return tryUnlock(event,'${m.id}')">
             <div class="unlock-row">
               <input type="password" placeholder="Senha da aula ${m.aula}" autocomplete="off" aria-label="Senha da Aula ${m.aula}">
               <button type="submit">Desbloquear</button>
             </div>
             <div class="err">Senha incorreta. Tente de novo.</div>
           </form>
           <div class="lock-hint">${lockSvg} Liberada na aula ${m.aula}</div>`
      }
    </article>`;
  }).join("");
  // progress
  const n = unl.filter(id=>MODULOS.some(m=>m.id===id)).length;
  document.getElementById("progTxt").textContent = n + " de " + MODULOS.length + " liberadas";
  document.getElementById("progDots").innerHTML = MODULOS.map((m,i)=>`<span class="dot ${i<n?'on':''}"></span>`).join("");
}

function tryUnlock(e, id){
  e.preventDefault();
  const form = e.currentTarget;
  const val = form.querySelector("input").value.trim();
  const m = MODULOS.find(x=>x.id===id);
  if(m && val === m.senha){
    unlock(id);
    renderHub();
    openTool(id);
  } else {
    form.classList.add("bad");
    const inp = form.querySelector("input"); inp.select();
    setTimeout(()=>form.classList.remove("bad"), 1500);
  }
  return false;
}

/* ---- tool view ---- */
const frame = document.getElementById("frame");
const loader = document.getElementById("loader");

function openTool(id){
  const m = MODULOS.find(x=>x.id===id);
  if(!m || !isUnlocked(id)) return;
  document.getElementById("toolName").innerHTML = "<b>Aula "+m.aula+"</b> · "+m.nome;
  buildQuick(id);
  loader.classList.remove("gone");
  frame.src = m.src;
  document.body.classList.add("in-tool");
  window.scrollTo(0,0);
}
frame.addEventListener("load", ()=>{ if(frame.getAttribute("src")) loader.classList.add("gone"); });

function backToHub(){
  document.body.classList.remove("in-tool");
  frame.removeAttribute("src");
  loader.classList.remove("gone");
  renderHub();
}

function buildQuick(activeId){
  const unlocked = MODULOS.filter(m=>isUnlocked(m.id));
  document.getElementById("quick").innerHTML = unlocked.map(m=>
    `<button class="q ${m.id===activeId?'q-on':''}" onclick="openTool('${m.id}')">${m.nome}</button>`
  ).join("");
}

renderHub();
</script>
</body>
</html>
